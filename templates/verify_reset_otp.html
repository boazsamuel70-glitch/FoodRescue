<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B4332">


    <title>Verify Email - FoodResQ</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='common.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='user.css') }}">

    <!-- FoodResQ website alert system (replaces native browser dialogs) -->
    <script src="{{ url_for('static', filename='website-alert.js') }}"></script>
    {% with _frq = get_flashed_messages(with_categories=true) %}{% if _frq %}
    <script>window.FOODRESQ_FLASH = {{ _frq|tojson }};</script>
    {% endif %}{% endwith %}
<script src="{{ url_for('static', filename='input-guard.js') }}" defer></script>
<link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">
<script src="{{ url_for('static', filename='nav-toggle.js') }}" defer></script>
</head>

<body>

<header>

    <div class="logo">

        <img src="{{ url_for('static', filename='images/homepgs.png') }}">

        <div>

            <h2>Food<span>ResQ</span></h2>

            <p class="tagline">
                Turning <span>Surplus</span> into <span>Sustenance</span>
            </p>

        </div>

    </div>

    <div class="navbar-back">
        <a href="/forgot_password">← Back</a>
    </div>

</header>


<section class="forgot-container">

    <div class="forgot-box">

        <h2>Verify Your Email</h2>

        <p class="forgot-description">
            A 6-digit verification code has been sent to your
            registered email address.
        </p>

        <form action="/verify_reset_otp" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <input type="text"
                   name="otp"
                   placeholder="Enter 6-digit OTP"
                   maxlength="6"
                   inputmode="numeric"
                   pattern="[0-9]{6}"
                   required>

            <button type="submit">
                Verify Code
            </button>

        </form>

        <p class="login-link">

            Didn't receive the code?

            <a href="/forgot_password">
                Request a new code
            </a>

        </p>

    </div>

</section>


</body>

</html>
