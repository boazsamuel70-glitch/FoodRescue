<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B4332">


    <title>Reset Password - FoodResQ</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='common.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='user.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- FoodResQ website alert system (replaces native browser dialogs) -->
    <script src="{{ url_for('static', filename='website-alert.js') }}"></script>
    {% with _frq = get_flashed_messages(with_categories=true) %}{% if _frq %}
    <script>window.FOODRESQ_FLASH = {{ _frq|tojson }};</script>
    {% endif %}{% endwith %}
<script src="{{ url_for('static', filename='input-guard.js') }}" defer></script>
<link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">
<script src="{{ url_for('static', filename='nav-toggle.js') }}" defer></script>
</head>

<body>

<section class="register-container">

    <div class="register-box">

        <h2>Create New Password</h2>

        <form action="/reset_password" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


            <div class="password-field">

                <input type="password"
                       name="password"
                       id="new_password"
                       placeholder="New Password"
                       required>

                <i class="fa-solid fa-eye password-toggle"
                   onclick="togglePassword('new_password', this)">
                </i>

            </div>


            <div class="password-field">

                <input type="password"
                       name="confirm_password"
                       id="confirm_password"
                       placeholder="Confirm New Password"
                       required>

                <i class="fa-solid fa-eye password-toggle"
                   onclick="togglePassword('confirm_password', this)">
                </i>

            </div>


            <button type="submit">
                Reset Password
            </button>

        </form>

    </div>

</section>


<script>

function togglePassword(id, icon) {

    const input = document.getElementById(id);

    if (input.type === "password") {

        input.type = "text";

        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");

    } else {

        input.type = "password";

        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");

    }

}

</script>

</body>

</html>
