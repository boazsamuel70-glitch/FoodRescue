<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{ title }} | FoodResQ</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;
font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#16302a;
background:radial-gradient(900px 500px at 10% -10%,#d9f7e4,transparent 60%),#f2fbf5}
.box{max-width:480px;width:100%;background:#fff;border:1px solid #dcefe3;border-radius:26px;padding:38px 26px;text-align:center;box-shadow:0 26px 60px rgba(15,122,61,.13)}
.code{font-size:64px;font-weight:800;line-height:1;background:linear-gradient(135deg,#0f7a3d,#1fae5e);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin:10px 0 8px;font-size:22px}p{margin:0 0 24px;color:#5c7a6e;line-height:1.6;font-size:14.5px}
a{display:inline-block;background:linear-gradient(135deg,#0f7a3d,#1fae5e);color:#fff;text-decoration:none;font-weight:600;padding:12px 26px;border-radius:12px;min-height:44px}
</style>
</head>
<body><div class="box"><div class="code">{{ code }}</div><h1>{{ title }}</h1><p>{{ message }}</p><a href="/">Back to FoodResQ</a></div></body>
</html>
